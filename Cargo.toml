[workspace]
resolver = "2"
members = [
    "crates/hylaeanrover_core",
    "crates/hylaeanrover_game",
    "crates/hylaeanrover_py",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
bevy = { version = "0.18.1", features = ["jpeg"] }
bevy_rapier3d = "0.33"
bevy_panorbit_camera = "0.34"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
